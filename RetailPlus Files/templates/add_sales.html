<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Sale | RetailPlus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-shop" viewBox="0 0 16 16">
                <path d="M2.97 1.35A1 1 0 0 1 3.73 1h8.54a1 1 0 0 1 .76.35l2.609 3.044A1.5 1.5 0 0 1 16 5.37v.255a2.375 2.375 0 0 1-4.25 1.458A2.37 2.37 0 0 1 9.875 8 2.37 2.37 0 0 1 8 7.083 2.37 2.37 0 0 1 6.125 8a2.37 2.37 0 0 1-1.875-.917A2.375 2.375 0 0 1 0 5.625V5.37a1.5 1.5 0 0 1 .361-.976zm1.78 4.275a1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0 1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0 1.375 1.375 0 1 0 2.75 0V5.37a.5.5 0 0 0-.12-.325L12.27 2H3.73L1.12 5.045A.5.5 0 0 0 1 5.37v.255a1.375 1.375 0 0 0 2.75 0 .5.5 0 0 1 1 0M1.5 8.5A.5.5 0 0 1 2 9v6h1v-5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5h6V9a.5.5 0 0 1 1 0v6h.5a.5.5 0 0 1 0 1H.5a.5.5 0 0 1 0-1H1V9a.5.5 0 0 1 .5-.5M4 15h3v-5H4zm5-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zm3 0h-2v3h2z"/>
            </svg> RetailPlus
        </div>
        <ul class="nav-links">
            <li><a href="/">Dashboard</a></li>
            {% if role != 'admin' %}
            <li><a href="/add_sales">Add Sale</a></li>
            {% endif %}
            <li><a href="/Inventory">Inventory</a></li>
            <li><a href="/sales_history">Sales History</a></li>
            {% if role == 'admin' %}
            <li><a href="/staff">Staff</a></li>
            {% endif %}
            <li><a href="/support">Help Desk</a></li>
            <li><a href="/logout" style="color: #f87171;">Logout</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="form-card">
            {% if error %}
            <div style="background-color: #fce4e4; color: #c0392b; padding: 12px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; border: 1px solid #e74c3c;">
                {{ error }}
            </div>
            {% endif %}
            <h2>Record a Sale / Generate Bill</h2>
            <form action="/add_sales" method="POST">
                
                <!-- Customer Name Field -->
                <div class="form-group">
                    <label for="customer_name">Customer Name</label>
                    <input type="text" id="customer_name" name="customer_name" placeholder="Enter customer name" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background: #ffffff; color: #1e293b;">
                </div>

                <h3>Products List</h3>
                <div id="product-rows-container">
                    <div class="product-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <select name="product_name[]" required style="flex: 2; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background: #ffffff; color: #1e293b;">
                            <option value="" disabled selected style="background: #ffffff; color: #64748b;">-- Choose an item --</option>
                            {% for item in inventory %}
                                <option value="{{ item.name }}" style="background: #ffffff; color: #1e293b;">{{ item.name }} (Selling Price: ₹{{ item.selling_price }})</option>
                            {% endfor %}
                        </select>
                        <input type="number" name="quantity[]" min="1" placeholder="Qty" value="1" required style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; background: #ffffff; color: #1e293b;">
                    </div>
                </div>

                <button type="button" id="add-item-btn" onclick="addProductRow()" style="background: #4f46e5; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-bottom: 15px;">+ Add Another Product</button>

                <br>
                <button type="submit" class="btn">Generate Bill & Save</button>
            </form>
        </div>
    </main>

    <script>
        function addProductRow() {
            const container = document.getElementById('product-rows-container');
            const firstRow = container.querySelector('.product-row');
            const newRow = firstRow.cloneNode(true);
            
            newRow.querySelector('select').selectedIndex = 0;
            newRow.querySelector('select').style.backgroundColor = '#ffffff';
            newRow.querySelector('select').style.color = '#1e293b';
            
            const numInput = newRow.querySelector('input[type="number"]');
            numInput.value = 1;
            numInput.style.backgroundColor = '#ffffff';
            numInput.style.color = '#1e293b';
            
            container.appendChild(newRow);
        }
    </script>
</body>
</html>
